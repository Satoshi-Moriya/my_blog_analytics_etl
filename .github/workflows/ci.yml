name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cp .env.example .env
          docker build -t dbt-app .

      - name: Run sqlfluff lint
        run: docker run --rm --env-file .env dbt-app sqlfluff lint ./dbt/models/